services:
  backend:
    build:
      context: ./backend
    container_name: financy-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/financy.db
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      UPLOADS_DIR: /data/uploads
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
    ports:
      - '4000:4000'
    volumes:
      - financy-data:/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:4000/graphql}
    container_name: financy-frontend
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  financy-data:
